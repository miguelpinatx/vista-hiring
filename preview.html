 const tabs=[["new","New",["store"]],["iv","Interviewing",["interview"]],["hired","Hired",["hirereq","offer","onboard"]],["ready","Ready to schedule",["ready"]],["start","Starting soon",["starting"]]];

 const row=(c,inner,act)=>`<div class="card pad" style="margin-bottom:10px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b style="font-size:16px">${esc(c.name)}</b><div class="why">${esc(c.job?job(c.job).title:(c.req&&c.req.pos)||"Open to anything")} · ${esc(c.type)} · ${shiftW(c.shift)}</div><div style="margin-top:6px">${dayDots(c.days)}</div>${inner||""}</div><div class="nx" style="justify-content:flex-end">${act||""}</div></div>${S.svForm===c.id?svForm(c):""}</div>`;

 if(T==="ready")body=L.map(c=>row(c,`<div class="why" style="margin-top:6px">Onboarding is done. Pick their first day and start time. You discussed ${esc(fdFmt(c.req)||"no date")}.</div><div style="margin-top:8px">${fdEditor(c,"store","Confirm first day")}</div>`,"")).join("");
 if(T==="start")body=L.map(c=>row(c,`<div style="margin-top:6px;font-weight:800;font-size:16px">First day ${esc(fdFmt(c.first))}</div><div class="why">Set by ${esc(c.first.by)}</div><details style="margin-top:6px"><summary class="why" style="cursor:pointer">Change first day</summary>${fdEditor(c,"store","Save change")}</details>`,`<button type="button" class="btn p" data-svsched="${c.id}">+ Add to schedule</button>`)).join("");
 return head+(body||`<div class="card empty">${{new:"Nothing new from the office.",iv:"No interviews right now.",hired:"Nobody waiting on the office.",ready:"Nobody ready to schedule yet. They show here after onboarding is done.",start:"No first days coming up."}[T]}</div>`)}

function modal(h){$("#layer").innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="md">${h}</div></div>`;const f=$("#layer .md").querySelector("textarea,input,select,button");f&&f.focus()}

function decide(d){const c=cand(S.sel);if(!c||c.stage!=="new")return;const L=filtered();const i=L.findIndex(x=>x.c.id===c.id);
 if(d==="yes"){c.stage="review";c.dec="interested";log(c,"Marked Interested");toast("✓ Interested · "+c.name)}
 if(d==="maybe"){c.stage="review";c.dec="maybe";log(c,"Marked Maybe");toast("? Maybe · "+c.name)}
 if(d==="no"){c.stage="out";c.dec="no";log(c,"Marked Not a fit");toast("✗ Not a fit · "+c.name)}
 const L2=filtered();S.sel=(L2[Math.min(i,L2.length-1)]||{c:{}}).c.id||null;S.dtab="app";render()}
document.addEventListener("keydown",e=>{if(S.view!=="cands"||$("#layer").innerHTML||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();
 if(k==="y")decide("yes");else if(k==="m")decide("maybe");else if(k==="n")decide("no");
 else if(k==="j"||k==="k"){const L=filtered();const i=L.findIndex(x=>x.c.id===S.sel);const n=L[i+(k==="j"?1:-1)];if(n){S.sel=n.c.id;render()}}});

 if(t.id==="fJob"){S.job=t.value;S.sel=null;render()}if(t.id==="fStore"){S.store=t.value;S.sel=null;render()}
 if(t.dataset.onb){const[cid,k]=t.dataset.onb.split(":");const c=cand(cid);c.onb=c.onb||{};c.onb[k]=t.checked;if(k==="fh")c.fh=t.checked?1:0;if(k==="tabc")c.tabc=t.checked?1:0;log(c,(t.checked?"Checked: ":"Unchecked: ")+{tt:"T&T onboarding",fh:"Food Handler",tabc:"TABC"}[k]);render();return}
 if(t.id==="svStore"){S.sv=t.value;S.svForm=null;render()}
 if(t.id==="mK"){S.msg.k=t.value;msgRender()}if(t.id==="mMailer"){S.msg.mailer=t.value;msgRender()}});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.view){S.view=d.view;close();render();window.scrollTo(0,0);return}
 if(d.goto){const[j,k]=d.goto.split(":");S.view="cands";S.job=j;S.cf=k;S.sel=null;S.dtab="app";render();window.scrollTo(0,0);return}
 if(d.cf){S.cf=d.cf;S.sel=null;render();return}
 if(d.sel){S.sel=d.sel;S.dtab="app";render();return}
 if(d.open){S.view="cands";S.cf="all";S.job="__all";S.store="__all";S.sel=d.open;render();return}
 if(d.dec){decide(d.dec);return}
 if(d.dtab){S.dtab=d.dtab;render();return}
 if(d.back){const c=cand(d.back);c.stage="new";c.dec=null;delete c.store;log(c,"Moved back to New");follow(cand(c.id));render();return}
 if(d.future){const c=cand(d.future);c.stage="future";log(c,"Saved to Future pool");toast("Saved to Future pool");follow(cand(c.id));render();return}
 if(d.out){const c=cand(d.out);c.stage="out";log(c,"Not moving forward");tplModal(c.id,"no");follow(cand(c.id));render();return}
 if(d.assign){const[cid,jid]=d.assign.split(":");const c=cand(cid);c.job=jid;log(c,"Put on "+jobName(job(jid)));toast("Now on "+jobName(job(jid)));follow(cand(c.id));render();return}
 if(d.assignsel){const c=cand(d.assignsel);c.job=$("#asg").value;log(c,"Put on "+jobName(job(c.job)));toast("Now on "+jobName(job(c.job)));follow(cand(c.id));render();return}
 if(d.screen){const c=cand(d.screen);modal(`<h3>Phone screen · ${esc(c.name)}</h3><div class="f2"><label class="f"><span>How did it go?</span><select id="sOut"><option value="good">Good · move forward</option><option value="noans">No answer</option><option value="no">Not a fit</option></select></label></div><label class="f" style="display:block;margin-top:8px"><span>Notes</span><textarea id="sNote" placeholder="Availability, transportation, questions they asked…"></textarea></label><div class="mb"><button type="button" class="btn" data-close="1">Cancel</button><button type="button" class="btn p" data-screensave="${c.id}">Save</button></div>`);return}
 if(d.screensave){const c=cand(d.screensave),o=$("#sOut").value,n=$("#sNote").value.trim();if(n)c.notes.unshift({who:"Office",when:"Nov 20",t:n});

   else if(rq&&rq.confirmed_at){const fd=Date.parse((o.first.date||"")+"T12:00");o.stage=(!isNaN(fd)&&fd<Date.now()-14*864e5)?"hired":"starting"}
   else if(rq&&rq.ready_at){o.stage="ready";o.onb={tt:true,fh:!!c.fhHave,tabc:!!c.tabcHave}}
   else if(rq&&rq.status==="pending")o.stage="hirereq";
   else if(rq&&rq.status==="approved")o.stage=st==="hired"?"onboard":"offer";
   else if(st==="hired")o.stage="hired";
   else if(st==="offer")o.stage="offer";
   else if(st==="interview"||sh.some(x=>x.claimed_at))o.stage="interview";
   else if(sh.length)o.stage="store";
   else if(st==="screen"){o.stage="screen";o.dec="interested"}
   if(["offer","onboard"].includes(o.stage)&&!o.offer)o.offer={rate:"",type:o.type,hrs:"",ans:"Waiting"};
   if(o.stage==="onboard")o.onb={tt:false,fh:!!c.fhHave,tabc:!!c.tabcHave};
   return o});
  S.cands.forEach(c=>{c.job=pvJobFor(c,S.jobs)});
  S.hires=[];
  pvGate("");
  const n=S.cands.filter(c=>c.stage==="new").length;
  document.getElementById("pvCount").textContent=`${S.cands.length} real applicants · ${n} new · ${S.jobs.filter(j=>j.open).length} open jobs`;
  render();
 }catch(e){console.error(e);pvGate(`<div class="pvc"><h2>Couldn’t load</h2><p>Something went wrong reading the Hiring Tracker. Reload to try again.</p><p class="why">${esc(e.message||String(e))}</p><p><button type="button" class="btn" onclick="location.reload()">Reload</button></p></div>`)}
}

document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;const h=a.getAttribute("href")||"";
 if(/^(mailto:|sms:|tel:)|outlook\.|mail\.google|ms-outlook/i.test(h)){e.preventDefault();e.stopPropagation();toast("Preview: emails, texts and calls are turned off. In the live version this opens your message.")}},true);
window.addEventListener("beforeunload",()=>{});

render();pvBoot();
</script>
