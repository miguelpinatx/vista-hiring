<title>Vista Hiring Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vista Hiring">
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top nav (Jobs, Candidates, Interviews, Stores, Careers page, Templates, Match settings); each view fills the page. Sample data lives in this browser only. */
:root{--bg:#f5f3f7;--card:#fff;--sunk:#efecf2;--line:#e2dde8;--ink:#231b2b;--muted:#665f70;
 --p:#6b3a8f;--p2:#55296f;--ps:#f0e6f7;--g:#2E7D32;--gs:#e5f1e2;--y:#FEC938;--ys:#fff3c9;--yi:#6e5200;--r:#b4470f;--rs:#fde6d7;--b:#2c5aa0;--bs:#e3ebf7;
 --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131b;--card:#211b27;--sunk:#2a2231;--line:#3a3142;--ink:#ece6f2;--muted:#ab9fb8;--p:#c39be0;--p2:#d7b8ee;--ps:#33263f;--g:#62b866;--gs:#203421;--y:#f2c53b;--ys:#3a3218;--yi:#f2d27a;--r:#f3a77a;--rs:#3d2416;--b:#9dbbec;--bs:#1d2a3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17131b;--card:#211b27;--sunk:#2a2231;--line:#3a3142;--ink:#ece6f2;--muted:#ab9fb8;--p:#c39be0;--p2:#d7b8ee;--ps:#33263f;--g:#62b866;--gs:#203421;--y:#f2c53b;--ys:#3a3218;--yi:#f2d27a;--r:#f3a77a;--rs:#3d2416;--b:#9dbbec;--bs:#1d2a3e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#5a2d7c}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(90deg,#5e2f78,#834B9E);color:#fff}
.topin{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-d);font-weight:800;font-size:22px;margin-right:6px}.brand small{font-family:var(--f-b);font-size:11.5px;font-weight:800;background:var(--y);color:#3a2c00;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:3px}
nav.nv{display:flex;gap:2px;flex-wrap:wrap}
nav.nv button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:#fff;opacity:.82;border-radius:9px;padding:7px 11px;cursor:pointer}
nav.nv button.on{background:rgba(255,255,255,.2);opacity:1}
nav.nv .n{display:inline-block;margin-left:4px;font-size:11.5px;background:var(--y);color:#3a2c00;border-radius:999px;padding:0 6px}
.sp{flex:1}
.top input{max-width:190px;background:rgba(255,255,255,.16);border:0;color:#fff}.top input::placeholder{color:rgba(255,255,255,.75)}
.stripe{height:4px;background:linear-gradient(90deg,#FEC938 0 25%,#f07b2a 25% 50%,#4caf50 50% 75%,#1e88e5 75%)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
.guide{display:flex;gap:10px;background:var(--bs);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}.guide b{color:var(--b)}
h1{font-family:var(--f-d);font-size:30px;margin:0 0 2px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 12px}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}.hd .sub{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.btn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}.btn.g{background:var(--g);border-color:var(--g);color:#fff}.btn.sm{padding:5px 10px;font-size:13px}.btn.link{border:0;background:none;color:var(--p);padding:4px 6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pg{background:var(--gs);color:var(--g)}.py{background:var(--ys);color:var(--yi)}.pr{background:var(--rs);color:var(--r)}.pb{background:var(--bs);color:var(--b)}.pp{background:var(--ps);color:var(--p)}.px{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip .n{opacity:.7;margin-left:3px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.scroll{overflow-x:auto}
.cnt{font:inherit;font-weight:800;font-size:16px;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:8px;padding:3px 9px}
.cnt.z{color:var(--muted);font-weight:500;cursor:default}.cnt.nw{background:var(--ys);color:var(--yi)}
.cnt:not(.z):hover{background:var(--sunk)}
.jt b{display:block}.jt small{color:var(--muted)}
.closed td{opacity:.55}
/* review */
.rv{display:grid;grid-template-columns:320px minmax(0,1fr);overflow:hidden;min-height:560px}
.ls{border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;min-width:0}
.lsh{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.lsb{overflow:auto;max-height:640px}
.ci{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 8px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;font:inherit;color:var(--ink)}
.ci small{color:var(--muted)}.ci.on{background:var(--card);box-shadow:inset 4px 0 0 var(--p)}
.ci .sc{grid-row:1/3;grid-column:2;align-self:center;font-weight:800;font-size:13px}
.dt{padding:16px 18px;display:grid;gap:12px;align-content:start;min-width:0}
.dh{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.av{width:48px;height:48px;border-radius:50%;background:var(--ps);color:var(--p);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:21px;flex:none}
.dh h2{margin:0;font-family:var(--f-d);font-size:27px;line-height:1}.dh small{color:var(--muted)}
.flow{display:flex;margin:2px 0}
.fs{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;padding-top:18px}
.fs::before{content:"";position:absolute;top:5px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.fs::after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:3px;background:var(--line)}.fs:first-child::after{display:none}
.fs.d{color:var(--p)}.fs.d::before,.fs.d::after{background:var(--p)}.fs.c{color:var(--ink)}.fs.c::before{background:var(--card);border:3px solid var(--p);width:14px;height:14px;top:4px}
.dec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ps);border-radius:12px;padding:10px 12px}
.db{font:inherit;font-weight:800;font-size:14px;padding:8px 13px;border-radius:10px;border:2px solid;background:var(--card);cursor:pointer}
.db.y{border-color:var(--g);color:var(--g)}.db.m{border-color:#b08a00;color:#8a6a00}.db.n{border-color:var(--r);color:var(--r)}
kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:4px}
.nx{display:flex;gap:8px;flex-wrap:wrap}
.dtabs{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.dtabs button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);padding:8px 0;cursor:pointer}.dtabs button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--p)}
.g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}.box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:14.5px}.kv span{color:var(--muted)}
.days{display:flex;gap:3px}.days i{font-style:normal;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--sunk);color:var(--muted)}.days i.on{background:var(--p);color:#fff}
.why{font-size:13px;color:var(--muted)}
.score{position:relative;display:inline-block}
.score .tip{display:none;position:absolute;right:0;top:120%;width:250px;background:var(--ink);color:var(--card);font-size:12.5px;border-radius:10px;padding:8px 10px;z-index:5;text-align:left;font-weight:500}
.score:hover .tip,.score:focus-within .tip{display:block}
.act{display:grid;gap:8px}.ai{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:14px}.ai span{color:var(--muted)}
.note{border-left:3px solid var(--p);background:var(--sunk);border-radius:0 8px 8px 0;padding:7px 10px;font-size:14px}.note small{display:block;color:var(--muted)}
.offer{border:2px solid var(--g);border-radius:12px;padding:12px 14px;background:var(--gs)}
.offer h4{margin:0 0 6px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--g)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
label.f span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
input,select,textarea{font:inherit;font-size:15px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
/* stores */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.st h3{margin:0;font-family:var(--f-d);font-size:23px}
.st .ln{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}.st .ln:first-of-type{border-top:0}
.st .ln span{color:var(--muted)}
.alert{display:flex;gap:8px;align-items:flex-start;background:var(--rs);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.bar{height:7px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
/* interviews */
.day{margin-bottom:12px}.day h3{margin:0 0 6px;font-size:16px}
.ivr{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.ivr:first-child{border-top:0}
/* careers preview */
.pub{max-width:700px;margin:0 auto}
.pubh{background:linear-gradient(120deg,#2E7D32,#1b5e20);color:#fff;border-radius:14px 14px 0 0;padding:18px 20px}.pubh h2{margin:0;font-size:28px;font-family:var(--f-d)}
.pj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--card)}
.pj b{font-size:17px}.pj small{color:var(--muted)}
.dayp{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dayp button{font:inherit;font-weight:800;font-size:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 0;cursor:pointer}.dayp button.on{background:var(--g);border-color:var(--g);color:#fff}
/* settings */
.wt{display:grid;grid-template-columns:180px minmax(0,1fr) 50px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.wt:first-child{border-top:0}
.wt input[type=range]{padding:0;border:0;accent-color:var(--p)}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(20,12,28,.5);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--card);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h3{margin:0 0 4px;font-family:var(--f-d);font-size:25px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#231b2b;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;z-index:80;max-width:calc(100% - 32px)}
@media (max-width:820px){.top{position:static}body::before{display:none}nav.nv{flex-wrap:nowrap;overflow-x:auto;max-width:100%}nav.nv button{flex:none}.rv{grid-template-columns:1fr}.ls{border-right:0;border-bottom:1px solid var(--line)}.lsb{max-height:260px}.g2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.wt{grid-template-columns:1fr 50px}.wt b{grid-column:1/-1}.top input{max-width:none;flex:1 1 100%}}
.pvb{background:#fff4d6;border-bottom:2px solid #e0b100;color:#4a3800;padding:9px 16px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.pvn{background:#fff;border:1px solid #e0b100;border-radius:999px;padding:2px 10px;font-weight:700;font-size:12.5px}
#pvGate[hidden]{display:none}#pvGate{position:fixed;inset:0;background:rgba(20,12,28,.55);display:grid;place-items:center;z-index:90;padding:16px}
.pvc{background:var(--card);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.pvc h2{margin:0 0 6px;font-family:var(--f-d);font-size:26px}.pvc p{margin:8px 0}.pvc .btn{text-decoration:none;display:inline-block}
/* Vista Markets brand */
:root{--p:#834B9E;--p2:#6a3a82;--ps:#F1E8F6;--y:#FEC938;--b:#007BC4;--bs:#e1f0fa;--g:#2F8A3B;--f-d:"Baloo 2","Figtree",system-ui,sans-serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
.brand{display:inline-flex;align-items:center;gap:8px}.brand>span{font-family:var(--f-d);font-weight:800;font-size:22px;letter-spacing:0}
.blogo{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 7px;display:block}
@media (max-width:640px){.blogo{height:28px}}
/* ---------- Eastlake pioneers ---------- */
.pio{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:#6e5200;background:#fff3c9;border:1px solid #f0c94a;border-radius:999px;padding:1px 8px;white-space:nowrap}
.piobox{border:2px solid #f0c94a;background:#fffbea;border-radius:12px;padding:12px 14px}
.piobox h4{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:#6e5200}
.ck{display:flex;gap:8px;align-items:center;font-size:14px}.ck input{width:18px;height:18px;margin:0}
.pst{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pst.r{background:var(--g);color:#fff}.pst.t{background:var(--b);color:#fff}.pst.h{background:var(--ps);color:var(--p)}
.pchip{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}.pchip.ok{color:var(--g);border-color:#9ed493;background:var(--gs)}
.ehd{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;background:linear-gradient(135deg,#fff8e1,var(--card) 60%)}
.ecnt{font-family:var(--f-d);font-size:44px;font-weight:800;color:#c2410c;line-height:1;margin-right:6px}
.sbar{display:flex;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}.sbar.big{height:16px}.sbar i{display:block;height:100%}
.b1{background:var(--g)}.b2{background:var(--b)}.b3{background:#b48ad0}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.waves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.wv{position:relative;display:grid;gap:3px;padding:10px 12px}.wv.now{border:2px solid #f07b2a;background:#fff6ee}.wv.past{opacity:.55}
.wv .tag{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;color:#fff;background:#f07b2a;border-radius:999px;padding:1px 8px}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.dcd{display:grid;gap:8px;padding:12px 14px}.dcd.none{border-style:dashed}
.dcd h3{margin:0;font-size:17px;flex:1}.dch{display:flex;gap:8px;align-items:center}
.prw{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:6px;cursor:pointer;text-align:left;font:inherit;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;width:100%}
.prw:hover b{color:var(--p);text-decoration:underline}
.lead{font-size:11px;font-weight:800;color:#6e5200;background:#fff3c9;border-radius:999px;padding:0 6px}
.opn{color:#c2410c;font-weight:700}.nol{color:#8a6a00;font-weight:700}
.ld{display:grid;grid-template-columns:110px 1fr 28px auto;gap:10px;align-items:center;padding:4px 0}
@media (max-width:820px){.waves{grid-template-columns:repeat(2,1fr)}.ecnt{font-size:36px}}
@media (max-width:520px){.waves{grid-template-columns:1fr}}

/* calendar, evaluations, import, team */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chip.warn{border-color:var(--r);color:var(--r)}.chip.warn.on{background:var(--r);border-color:var(--r);color:#fff}
.prow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.prow .pt b{display:block;font-variant-numeric:tabular-nums}.prow .pt small{color:var(--muted)}
.pgs .prow{grid-template-columns:74px minmax(0,1fr)}.pgs .prow>.nx{grid-column:2}
.pgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.pgs h3{margin:0;padding:10px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.evd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}.ev-screen{background:var(--b)}.ev-interview{background:var(--p)}.ev-start{background:var(--g)}
.r-yes{color:var(--g)}.r-maybe{color:#8a6a00}.r-no{color:var(--r)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.recs button{font:inherit;font-weight:800;font-size:15px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.recs button.r-yes[aria-pressed=true]{background:var(--gs);border-color:var(--g)}.recs button.r-maybe[aria-pressed=true]{background:var(--ys);border-color:#b08a00}.recs button.r-no[aria-pressed=true]{background:var(--rs);border-color:var(--r)}
.topt{display:grid;grid-template-columns:18px minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:6px}
.topt select{padding:6px 8px;font-size:14px}

 if(T==="iv")body=L.map(c=>row(c,`<div class="why" style="margin-top:6px">Interview ${esc(c.iv||"")}${c.ivBy?` · <b>booked by ${c.ivBy==="store"?"you":"the office"}</b>`:""}</div>`,`<button type="button" class="btn" data-svpass="${c.id}">Pass</button><button type="button" class="btn g" data-svhire="${c.id}">Request approval to hire</button>`)).join("");
 if(T==="hired")body=L.map(c=>row(c,`<div style="margin-top:6px">${c.stage==="hirereq"?`<span class="pill pb">Waiting on office approval</span>`:c.stage==="offer"?`<span class="pill pg">Office sent the offer</span>`:`<span class="pill py">Onboarding with T&amp;T</span>`} <span class="why">First day you discussed: ${esc(fdFmt(c.req)||"—")}</span></div>`,"")).join("");
 if(T==="ready")body=L.map(c=>row(c,`<div class="why" style="margin-top:6px">Onboarding is done. Pick their first day and start time. You discussed ${esc(fdFmt(c.req)||"no date")}.</div><div style="margin-top:8px">${fdEditor(c,"store","Confirm first day")}</div>`,"")).join("");

 const E=eastCfg(),dl=E.depts.map(d=>d.name);if(p.dept&&!dl.includes(p.dept))dl.push(p.dept);const st=pioStatus(c),ts=p.trainStore||storeOf(c);

  <div class="nx" style="margin-top:4px;align-items:center">${pioNeed(c,"fh")?`<span class="pchip ${c.fh?"ok":""}">${c.fh?"✓":"○"} Food Handler card</span>`:""}${pioNeed(c,"tabc")?`<span class="pchip ${c.tabc?"ok":""}">${c.tabc?"✓":"○"} TABC</span>`:""}
   <label class="ck"><input type="checkbox" data-pf="${c.id}:videos" ${p.videos?"checked":""}>3-day training videos done</label><label class="ck"><input type="checkbox" data-pf="${c.id}:signoff" ${p.signoff?"checked":""}>${esc(ts||"Training store")} manager signed off</label></div>
  ${st==="h"?`<div class="why" style="margin-top:6px">Counts as <b>Hiring</b> until they’re hired. Send the <b>★ Pioneer offer</b> from ✉ Message.</div>`:""}</div>`}
function vEast(){const E=eastCfg(),pio=S.cands.filter(c=>c.pioneer),today=dkey(new Date());
 const days=Math.round((new Date(E.openDate+"T12:00")-new Date(today+"T12:00"))/864e5);
 const by={};pio.forEach(c=>{const d=c.pioneer.dept||"__none";(by[d]=by[d]||[]).push(c)});

 const card=d=>{const L=(by[d.name]||[]).slice().sort((a,b)=>(b.pioneer.lead?1:0)-(a.pioneer.lead?1:0)),t=+d.target||0;
  const r=L.filter(c=>pioStatus(c)==="r").length,tr=L.filter(c=>pioStatus(c)==="t").length,h=L.filter(c=>pioStatus(c)==="h").length,op=Math.max(0,t-r-tr-h),w=n=>t?Math.min(100,n/t*100):0,lead=L.some(c=>c.pioneer.lead);

   <div class="why">${[r&&`${r} ready`,tr&&`${tr} in training`,h&&`${h} hiring`,op&&`<span class="opn">${op} open</span>`].filter(Boolean).join(" · ")||"Fully staffed"}${!lead&&t>1?` · <span class="nol">no lead yet</span>`:""}</div>${L.map(row).join("")}</div>`};
 const un=by.__none||[];
 return `<div class="hd"><div><h1>★ Eastlake opening</h1><p class="sub">Pioneers train at a current store, then move to Eastlake before opening day.</p></div></div>
 ${E.dflt?`<div class="guide"><span>ℹ</span><span>No opening day saved yet, so this assumes <b>70 days from today</b>. In the live tracker, set the real date and headcounts once and they stay.</span></div>`:""}
 <div class="card pad ehd"><div><div><span class="ecnt">${days>0?days:days===0?"Today":"Open"}</span>${days>0?"days to opening":""}</div><label class="f" style="margin-top:8px;max-width:220px"><span>Opening day</span><input type="date" id="eOpen" value="${esc(E.openDate)}"></label></div>
  <div style="flex:1 1 380px;display:grid;gap:8px"><div style="font-variant-numeric:tabular-nums"><b>${R+T}</b> of ${total} filled · <b>${R}</b> ready${H?` · ${H} hiring`:""}</div>

 <div class="waves">${W.map((w,i)=>`<div class="card wv ${i===cur?"now":-days>w[2]?"past":""}"><span class="why" style="font-variant-numeric:tabular-nums">${esc(fmtD(addD(E.openDate,w[1])))} – ${esc(fmtD(addD(E.openDate,w[2])))}</span><b>${i+1}. ${esc(w[0])}</b><span class="why">${esc(w[3])}</span>${i===cur?`<span class="tag">Now</span>`:""}</div>`).join("")}</div>

function parseApps(text){const lines=text.replace(/\r/g,"").split("\n").filter(l=>!JUNK_LINE.test(l.trim()));const apps=[];let cur={},key=null,buf=[];
 const flush=()=>{if(key){const v=cleanV(buf.join("\n"));if(v)cur[key]=v}key=null;buf=[]};
 for(const raw of lines){const sm=raw.trim().match(/^Submitted (\d{1,2}):(\d{2}) ?([AP]M) - (\d{1,2}) ([A-Za-z]+) (\d{4})$/i);
  if(sm){flush();const mo=MONTHS[sm[5].toLowerCase()];if(mo!==undefined){let h=+sm[1]%12;if(/pm/i.test(sm[3]))h+=12;cur.submittedAt=new Date(+sm[6],mo,+sm[4],h,+sm[2]).getTime()}continue}
  const t=raw.trim(),m=t.toLowerCase().match(/^([a-z_][a-z0-9-]*)(\s*:?\s*)(.*)$/);let k=null,rest="";
  if(m&&(KEYMAP[m[1]]!==undefined||m[1].startsWith("_"))&&(m[3]===""||m[2].includes(":"))){k=m[1];rest=t.slice(m[1].length+m[2].length)}
  if(k){flush();if(k.startsWith("_"))continue;const field=KEYMAP[k];if(field==="name"&&cur.name){apps.push(cur);cur={}}key=field;if(rest)buf.push(rest)}
  else if(key)buf.push(raw)}
 flush();if(Object.keys(cur).length)apps.push(cur);
 return apps.filter(a=>a.name||a.email||a.phone).map(a=>{appExtra(a);a.phone=fmtPh(a.phone||"");a.store=pvStore(a.storeRaw)||"";a.interviewer="Miguel";return a})}
const APP_EXTRA=[["hoursPerWeek","Hours per week"],["bestContact","Best way to reach"],["languages","Languages"],["age18","18 or older"],["workAuthorized","Authorized to work in the US"],["transportation","Reliable transportation"],["workedAtVista","Worked at Vista before"],["workedAtVistaDetail","Vista details"],["firstJob","First job"],["yearsExperience","Years of experience"],["foodHandler","Food Handler"],["tabcAnswer","TABC"]];
function appExtra(a){if(/^yes/i.test(a.foodHandler||""))a.fhHave=true;if(/^yes/i.test(a.tabcAnswer||""))a.tabcHave=true;const L=APP_EXTRA.filter(([k])=>a[k]).map(([k,l])=>l+": "+a[k]);if(L.length)a.appNotes="From the application: "+L.join(" · ");return a}
const psDup=a=>{const d=digits(a.phone).slice(-10),e=(a.email||"").toLowerCase();return S.cands.find(c=>(e&&(c.email||"").toLowerCase()===e)||(d.length===10&&digits(c.phone).slice(-10)===d))};

 const nNew=PARSED.filter(a=>!psDup(a)).length,nUp=PARSED.length-nNew;
 o.innerHTML=`<div class="why" style="font-weight:700;margin-bottom:6px">Found ${PARSED.length} · ${nNew} new${nUp?` · ${nUp} already in the tracker (their info gets updated)`:""}</div><div class="prv">${PARSED.map(a=>{const d=psDup(a);return `<div class="pi"><b>${esc(a.name||"(no name)")}</b> ${d?`<span class="pill py">Already in tracker</span>`:`<span class="pill pg">New</span>`} ${/span|espa/i.test(a.formLanguage||"")?`<span class="pill px">ES</span>`:""}<div class="why">${esc([a.phone,a.email].filter(Boolean).join(" · "))}</div><div class="why">${esc([a.position,a.store||a.storeRaw,a.employmentType,a.shift].filter(Boolean).join(" · "))}</div></div>`}).join("")}</div>`;
 b.disabled=false;b.textContent=nNew?`Add ${nNew} as New`+(nUp?` · update ${nUp}`:""):`Update ${nUp}`}
function psAdd(){let added=0,updated=0,last=null;const now=Date.now();
 PARSED.forEach((a,i)=>{const d=psDup(a);
  if(d){if(a.name)d.name=a.name;if(a.phone)d.phone=a.phone;if(a.email)d.email=a.email;if(a.address)d.addr=a.address;log(d,"Updated from a pasted application");updated++;return}
  const at=a.submittedAt&&a.submittedAt<=now?a.submittedAt:now;const c=pvExtra(pvBasic("p"+now+"_"+i,{...a,createdAt:at},null),a);c.job=pvJobFor(c,S.jobs);c.log.push({when:pvWhen(now),t:"Added from a pasted application"});if(a.appNotes)c.notes.unshift({who:"Application",when:pvWhen(at),t:a.appNotes});S.cands.push(c);last=c.id;added++});
 close();if(last){S.view="cands";S.cf="new";S.job="__all";S.store="__all";S.pio=false;S.sel=last;S.dtab="app"}
 toast([added?`Added ${added} as New`:"",updated?`updated ${updated}`:""].filter(Boolean).join(", "));render()}
function loadPdfJs(){if(pdfjsReady)return pdfjsReady;pdfjsReady=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};sc.onerror=()=>{pdfjsReady=null;rej(new Error("load"))};document.head.appendChild(sc)});return pdfjsReady}
async function pdfToText(file){const lib=await loadPdfJs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
 for(let i=1;i<=doc.numPages;i++){const tc=await(await doc.getPage(i)).getTextContent();let line="",lastY=null;
  for(const it of tc.items){const y=it.transform?it.transform[5]:null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2&&line){out.push(line);line=""}line+=it.str;if(it.hasEOL){out.push(line);line=""}lastY=y}
  if(line)out.push(line);out.push("")}return out.join("\n")}

/* ---------- departments: one application, filter on the office side ---------- */
const DEPT_GROUPS=["Cashier / Front End","Stocker / Grocery","Produce","Meat / Butcher","Deli","Bakery / Tortilleria","Kitchen / Food Service","Receiving / Warehouse","Maintenance / Janitorial","Office / Bookkeeping","Management","Open to anything"];
function deptOfText(p){p=String(p||"").toLowerCase();
 if(!p||/open to anything|lo que haya/.test(p))return "Open to anything";
 if(/cash|front|caj/.test(p))return "Cashier / Front End";if(/stock|grocery|pricing|surt|abarrot/.test(p))return "Stocker / Grocery";if(/produce|fruta/.test(p))return "Produce";
 if(/meat|butch|carn/.test(p))return "Meat / Butcher";if(/deli/.test(p))return "Deli";if(/bak|tortill|cake|pan/.test(p))return "Bakery / Tortilleria";
 if(/kitchen|cook|commissary|food service|cocina/.test(p))return "Kitchen / Food Service";if(/receiv|warehouse|recibo|almac/.test(p))return "Receiving / Warehouse";
 if(/mainten|janit|clean|limp/.test(p))return "Maintenance / Janitorial";if(/office|book|ofic/.test(p))return "Office / Bookkeeping";if(/manag|supervis|lead|gerente/.test(p))return "Management";return "Open to anything"}
function deptOf(c){const j=job(c.job);return deptOfText(j?j.title:c.position)}
function deptCount(store,title){const d=deptOfText(title);return S.cands.filter(c=>!["out","future","hired"].includes(c.stage)&&(c.store||c.pref)===store&&deptOf(c)===d).length}
